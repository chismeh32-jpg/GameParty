<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a1e3a">
<title>Tienda de Cartas Brisaluz</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cards.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header id="hud">
  <a href="../" class="hud-back" title="Volver a la granja">←</a>
  <div class="hud-money" id="hud-money"></div>
  <div class="hud-when"><span id="hud-day"></span> · <span id="hud-clock"></span></div>
  <div class="hud-level">Nv <b id="hud-level"></b><div class="xp"><div id="xp-fill"></div></div></div>
  <div class="hud-rep" id="hud-rep" title="Reputación"></div>
  <button id="btn-mute" class="icon-btn" aria-label="Sonido">🔊</button>
</header>

<div id="hint" class="hint hidden"></div>

<main id="shop-wrap">
  <canvas id="shop" aria-label="Tu tienda de cartas"></canvas>
  <div id="paused" class="paused hidden">⏸ En pausa</div>
  <button id="btn-charge" class="charge hidden">💳 Cobrar <span class="n"></span></button>
  <button id="btn-day" class="day-btn hidden">☀️ Abrir la tienda</button>
</main>

<nav id="bar">
  <button data-ui="orders"><span>📦</span>Pedidos</button>
  <button data-ui="storage"><span>🗃️</span>Almacén</button>
  <button data-ui="open" class="star"><span>✨</span>Abrir sobres</button>
  <button data-ui="album"><span>🃏</span>Álbum</button>
  <button data-ui="vitrina" class="hidden"><span>🪟</span>Vitrina</button>
  <button data-ui="upgrades"><span>⭐</span>Mejoras</button>
</nav>

<div id="toasts" class="toasts"></div>

<div id="panel" class="panel hidden">
  <div class="sheet">
    <div class="sheet-head"><h2 id="panel-title"></h2><button id="panel-close" class="icon-btn" aria-label="Cerrar">✕</button></div>
    <div id="panel-body" class="sheet-body"></div>
  </div>
</div>

<div id="checkout" class="overlay hidden">
  <div class="co-box">
    <div class="co-head"><b>🧾 Caja registradora</b><button class="btn small" data-co="later">Más tarde</button></div>
    <div class="co-body"></div>
  </div>
</div>

<div id="opening" class="opening hidden">
  <div class="op-top"><div class="op-info"></div><button class="icon-btn" data-op="close" aria-label="Cerrar">✕</button></div>
  <div class="op-stage"></div>
  <div class="op-hint"></div>
  <div class="op-buttons"><button class="btn" data-op="all">Revelar todo</button><button class="btn primary hidden" data-op="exit">Terminar</button></div>
  <div class="op-tray"></div>
</div>

<div id="card-detail" class="overlay hidden"><div class="cd-box"><div class="cd-card"></div><div class="cd-info"></div></div></div>

<div id="modal" class="overlay hidden">
  <div class="modal-box"><h2 class="modal-title"></h2><div class="modal-body"></div><div class="modal-actions btn-row"></div></div>
</div>

<script src="../criaturas/js/data.js"></script>
<script src="../criaturas/js/maps.js"></script>
<script src="../criaturas/js/art.js"></script>
<script src="../criaturas/js/audio.js"></script>
<script src="js/cards.js"></script>
<script src="js/cardview.js"></script>
<script src="js/sfx.js"></script>
<script src="js/shop.js"></script>
<script src="js/opening.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
