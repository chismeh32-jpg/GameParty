<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#24391c">
<title>Granja Simulador</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="world" aria-label="Mapa de la granja"></canvas>

<!-- HUD -->
<header class="hud">
  <div class="hud-box clock-box">
    <div id="hud-date" class="date"></div>
    <div class="time"><span id="hud-weather"></span> <span id="hud-clock">06:00</span></div>
  </div>
  <div class="hud-stack">
    <div class="hud-box bars">
      <div class="bar-row" title="Energía">⚡ <div class="meter"><div id="energy-fill"></div></div><span id="hud-energy"></span></div>
      <div class="bar-row" title="Nivel">⭐ <div class="meter xp"><div id="xp-fill"></div></div><span id="hud-level"></span></div>
    </div>
  </div>
  <div class="hud-right">
    <div class="hud-box coins">🪙 <strong id="hud-coins">0</strong></div>
    <div class="hud-buttons">
      <button id="btn-pause" class="hud-box icon-btn" aria-label="Pausar">⏸️</button>
      <button id="btn-menu" class="hud-box icon-btn" aria-label="Menú">🎒</button>
    </div>
  </div>
</header>

<div id="toast-wrap" class="toast-wrap" aria-live="polite"></div>

<!-- Controles -->
<div class="controls">
  <div id="joystick" class="joystick" aria-label="Joystick"><div id="joy-knob" class="knob"></div></div>
  <button id="btn-action" class="action-btn" aria-label="Usar">A</button>
</div>

<footer class="bottom">
  <div id="tool-hint" class="tool-hint"></div>
  <div id="hotbar" class="hotbar"></div>
</footer>

<!-- Paneles -->
<div id="panel" class="panel hidden" role="dialog" aria-modal="true">
  <div class="panel-box">
    <div class="panel-head">
      <h2 id="panel-title"></h2>
      <button id="panel-close" class="icon-btn" aria-label="Cerrar">✕</button>
    </div>
    <div id="panel-body" class="panel-body"></div>
  </div>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div id="modal-actions" class="btn-row"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="sprites.js"></script>
<script src="game.js"></script>
</body>
</html>
